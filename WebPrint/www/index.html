<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LJ2600D Print">
  <title>LJ2600D Print</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/pdf.min.js" defer></script>
  <script src="vendor/lucide.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-lockup">
        <img src="icons/icon-180.png" alt="" width="38" height="38">
        <div>
          <h1>LJ2600D Print</h1>
          <p id="connectionLabel">正在检查打印服务</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="refreshButton" class="icon-button" type="button" aria-label="重新检查打印服务" title="重新检查打印服务">
          <i data-lucide="refresh-cw"></i>
        </button>
        <button id="settingsButton" class="icon-button mobile-only" type="button" aria-label="打开打印设置" title="打印设置">
          <i data-lucide="sliders-horizontal"></i>
        </button>
      </div>
    </header>

    <main class="workspace">
      <section class="preview-pane" aria-label="文档预览">
        <div id="emptyState" class="empty-state">
          <div class="paper-stack" aria-hidden="true">
            <div class="paper-back"></div>
            <div class="paper-front"><i data-lucide="file-text"></i></div>
          </div>
          <div class="empty-copy">
            <h2>选择要打印的文档</h2>
            <p>文件只在当前设备中处理，打印数据直接发送到家中的光猫。</p>
          </div>
          <button id="chooseButton" class="primary-button" type="button">
            <i data-lucide="plus"></i><span>选择 PDF 或图片</span>
          </button>
          <p class="format-note">支持 PDF、JPEG、PNG 和 WebP；图片可多选</p>
        </div>

        <div id="documentState" class="document-state" hidden>
          <div class="document-toolbar">
            <div class="document-identity">
              <strong id="documentName"></strong>
              <span id="documentMeta"></span>
            </div>
            <button id="replaceButton" class="text-button" type="button">
              <i data-lucide="replace"></i><span>更换</span>
            </button>
          </div>

          <div class="stage-wrap">
            <button id="previousPage" class="page-nav" type="button" aria-label="上一页" title="上一页">
              <i data-lucide="chevron-left"></i>
            </button>
            <div id="paperPreview" class="paper-preview">
              <canvas id="previewCanvas"></canvas>
              <div id="previewLoading" class="preview-loading" hidden>
                <span class="spinner"></span><span>正在生成预览</span>
              </div>
            </div>
            <button id="nextPage" class="page-nav" type="button" aria-label="下一页" title="下一页">
              <i data-lucide="chevron-right"></i>
            </button>
          </div>

          <div class="page-counter" aria-live="polite">
            <span id="currentPage">1</span><span class="counter-divider">/</span><span id="totalPages">1</span>
          </div>
        </div>
      </section>

      <aside id="settingsPanel" class="settings-panel" aria-label="打印设置">
        <div class="panel-heading">
          <div>
            <h2>打印设置</h2>
            <p>Lenovo LJ2600D · A4</p>
          </div>
          <button id="closeSettingsButton" class="icon-button mobile-only" type="button" aria-label="关闭设置" title="关闭设置">
            <i data-lucide="x"></i>
          </button>
        </div>

        <div class="setting-groups">
          <fieldset class="setting-group">
            <legend>页面</legend>
            <label class="field-label" for="pageRange">页码范围</label>
            <input id="pageRange" type="text" inputmode="text" placeholder="留空打印全部，例如 1-3,5" autocomplete="off">
            <p class="field-help" id="rangeHelp">选择文档后可指定页码，单次最多 24 页</p>
          </fieldset>

          <fieldset class="setting-group">
            <legend>版式</legend>
            <div class="segmented-control" role="radiogroup" aria-label="页面方向">
              <label><input type="radio" name="orientation" value="auto" checked><span>自动</span></label>
              <label><input type="radio" name="orientation" value="portrait"><span>纵向</span></label>
              <label><input type="radio" name="orientation" value="landscape"><span>横向</span></label>
            </div>
            <label class="select-row">
              <span>缩放</span>
              <select id="scaling">
                <option value="fit">适合页面</option>
                <option value="fill">填满页面</option>
              </select>
            </label>
          </fieldset>

          <fieldset class="setting-group">
            <legend>输出</legend>
            <label class="select-row">
              <span>内容类型</span>
              <select id="contentMode">
                <option value="text">文字</option>
                <option value="graphics">图形</option>
                <option value="photo">图片</option>
              </select>
            </label>
            <label class="select-row">
              <span>深浅</span>
              <select id="lightness">
                <option value="-2">最深</option>
                <option value="-1">较深</option>
                <option value="0" selected>标准</option>
                <option value="1">较浅</option>
                <option value="2">最浅</option>
              </select>
            </label>
            <label class="select-row">
              <span>分辨率</span>
              <select id="resolution">
                <option value="300">300 dpi · 网页推荐</option>
                <option value="600">600 dpi · 高清</option>
                <option value="1200">1200 dpi · 超高</option>
              </select>
            </label>
            <div class="toggle-row">
              <span><strong>双面打印</strong><small>长边翻页</small></span>
              <label class="switch"><input id="duplex" type="checkbox"><span></span></label>
            </div>
            <label class="stepper-row">
              <span>份数</span>
              <span class="stepper">
                <button id="decreaseCopies" type="button" aria-label="减少份数"><i data-lucide="minus"></i></button>
                <output id="copiesOutput">1</output>
                <button id="increaseCopies" type="button" aria-label="增加份数"><i data-lucide="plus"></i></button>
              </span>
            </label>
          </fieldset>

          <fieldset class="setting-group access-group">
            <legend>访问验证</legend>
            <label class="field-label" for="accessPin">打印 PIN</label>
            <input id="accessPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="首次使用时输入">
            <label class="remember-row"><input id="rememberPin" type="checkbox" checked><span>保存在这台设备</span></label>
          </fieldset>
        </div>
      </aside>
    </main>

    <footer class="action-bar">
      <div class="job-summary">
        <strong id="jobSummary">尚未选择文档</strong>
        <span id="jobStatus">打印服务状态检查中</span>
      </div>
      <button id="printButton" class="print-button" type="button" disabled>
        <i data-lucide="printer"></i><span>打印</span>
      </button>
    </footer>
  </div>

  <div id="settingsBackdrop" class="settings-backdrop" hidden></div>
  <input id="fileInput" type="file" accept="application/pdf,image/jpeg,image/png,image/webp" multiple hidden>

  <div id="progressDialog" class="dialog-backdrop" hidden>
    <section class="progress-dialog" role="dialog" aria-modal="true" aria-labelledby="progressTitle">
      <div class="progress-icon"><i data-lucide="printer"></i></div>
      <h2 id="progressTitle">正在准备打印</h2>
      <p id="progressDetail">正在读取文档</p>
      <div class="progress-track"><span id="progressBar"></span></div>
      <button id="cancelButton" class="secondary-button" type="button">取消</button>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
